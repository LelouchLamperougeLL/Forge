<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forge · Training Programme</title>
  <meta name="description" content="A personal, evidence-based multiphase training, nutrition and recovery programme. Works offline.">
  <meta name="theme-color" content="#0f1419">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('forge:settings') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <aside class="sidenav" id="sidenav" aria-label="Main navigation"></aside>
    <div class="content-col">
      <header class="topbar" id="topbar">
        <button class="icon-btn back-btn" id="backBtn" type="button" aria-label="Back" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <div class="topbar-title" id="topTitle">Forge</div>
        <button class="icon-btn" id="searchBtn" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        </button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="More pages" aria-haspopup="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>
      </header>
      <div class="banner" id="banner" hidden></div>
      <main id="main" tabindex="-1">
        <div class="loading" id="loading">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading programme…</p>
        </div>
      </main>
    </div>
    <nav class="bottomnav" id="bottomnav" aria-label="Primary"></nav>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This app needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
