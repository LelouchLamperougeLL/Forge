<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge · unit tests</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
    .pass { color: #157a3c; } .fail { color: #b42318; font-weight: 700; }
    pre { background: #f3f4f6; padding: 8px; overflow-x: auto; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } pre { background: #222; } }
  </style>
</head>
<body>
  <h1>Forge unit tests</h1>
  <p>Runs the pure calculation, markdown and content-integrity checks. Serve the app folder (see README) and open <code>tests/</code>.</p>
  <div id="summary"></div>
  <ol id="log"></ol>
  <script type="module">
    import * as C from '../js/calc.js';
    import { renderMarkdown, scanTokens } from '../js/md.js';
    import { loadContent, integrityReport, DB } from '../js/content.js';
    import { resolveSession, scheduleFor, weekPlan, phases, resolveValue, rirToRpe, estimateMinutes } from '../js/engine.js';

    const log = document.getElementById('log');
    let pass = 0, fail = 0;
    const ok = (name, cond, detail = '') => {
      const li = document.createElement('li');
      li.className = cond ? 'pass' : 'fail';
      li.textContent = `${cond ? 'PASS' : 'FAIL'} · ${name}${!cond && detail ? ' · ' + detail : ''}`;
      log.appendChild(li);
      cond ? pass++ : fail++;
    };
    const near = (a, b, tol = 0.05) => Math.abs(a - b) <= tol;
    // Checks that write this browser's storage (restoring it afterwards) run on the local server, or with ?storage;
    // elsewhere (the published copy on your phone) they are skipped and counted.
    const storageTests = ['localhost', '127.0.0.1'].includes(location.hostname) || new URLSearchParams(location.search).has('storage');
    let skipped = 0;
    const skip = name => {
      const li = document.createElement('li');
      li.textContent = `SKIP · ${name} (open the tests on the local server, or add ?storage)`;
      log.appendChild(li);
      skipped++;
    };

    // ---- strength
    const e = C.e1rm(100, 5, 0);
    ok('Epley 100 kg × 5 = 116.7', near(e.epley, 116.67, 0.01), e.epley);
    ok('Brzycki 100 kg × 5 = 112.5', near(e.brzycki, 112.5, 0.01), e.brzycki);
    ok('e1RM counts RIR as reps to failure', C.e1rm(100, 3, 2).repsToFailure === 5);
    ok('loadForReps inverts Epley', near(C.loadForReps(116.667, 5, 0), 100, 0.01));
    let r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 40, reps: 12, rir: 2 }, { load: 40, reps: 12, rir: 2 }] });
    ok('Top of range at target effort → +increment', r.action === 'increase' && r.nextLoad === 42.5, JSON.stringify(r));
    r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 40, reps: 12, rir: 0 }, { load: 40, reps: 12, rir: 0 }] });
    ok('Top of range but much harder than target → hold', r.action === 'hold' && r.nextLoad === 40, JSON.stringify(r));
    r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 40, reps: 10, rir: 2 }] });
    ok('Within range → hold, add reps', r.action === 'hold' && r.nextLoad === 40);
    r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 40, reps: 5, rir: 0 }] });
    ok('Far below range → reduce ~10% (rounded down to increment)', r.action === 'decrease' && r.nextLoad === 35, JSON.stringify(r));
    r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 40, reps: 7, rir: 1 }] });
    ok('Just below range once → hold', r.action === 'hold');
    r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 40, reps: 7, rir: 1 }], prevSets: [{ load: 40, reps: 7 }] });
    ok('Below range two sessions running → reduce', r.action === 'decrease');
    r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 20, reps: 16, rir: 4 }] });
    ok('Far too light → jump using e1RM', r.action === 'increase' && r.nextLoad >= 22.5, JSON.stringify(r));
    r = C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [{ load: 40, reps: 10, rir: 2 }, { load: 40, reps: 9, rir: 2 }], prevSets: [{ load: 40, reps: 10 }, { load: 40, reps: 9 }] });
    ok('No rep gain at same load → stall flag', r.stall === true);
    ok('Missing data handled', C.doubleProgression({ repMin: 8, repMax: 12, targetRir: 2, increment: 2.5, sets: [] }).action === 'need-data');
    const ramp = C.rampSets(60, { minLoad: 20, step: 2.5 });
    ok('Ramp sets increase and stay below work load', ramp.length >= 2 && ramp.every((s, i) => s.load < 60 && (i === 0 || s.load > ramp[i - 1].load)), JSON.stringify(ramp));
    ok('Ramp sets never below the minimum load', C.rampSets(25, { minLoad: 20, step: 2.5 }).every(s => s.load >= 20));

    // ---- body composition and energy
    ok('Navy equation (181 cm, neck 38, waist 86) ≈ 16.7%', near(C.navyBodyFat({ sex: 'male', heightCm: 181, neckCm: 38, waistCm: 86 }), 16.71, 0.05));
    ok('RFM (181, 86) ≈ 21.9%', near(C.relativeFatMass({ sex: 'male', heightCm: 181, waistCm: 86 }), 21.91, 0.01));
    ok('Deurenberg (31 y, 77 kg, 181 cm) ≈ 19.1%', near(C.deurenbergBodyFat({ sex: 'male', age: 31, weightKg: 77, heightCm: 181 }), 19.13, 0.02));
    ok('Mifflin–St Jeor (77, 181, 31, M) = 1751', near(C.bmrMifflin({ weightKg: 77, heightCm: 181, age: 31, sex: 'male' }), 1751.25, 0.01));
    const f = C.ffmi({ weightKg: 77, heightCm: 181, bfPct: 19 });
    ok('FFMI at 19% ≈ 19.0', near(f.ffmi, 19.04, 0.02));
    const en = C.energyTargets({ weightKg: 77, heightCm: 181, age: 31, sex: 'male', pal: 1.6, goalPct: 0, proteinGkg: 2, fatGkg: 0.8, fibrePer1000: 14 });
    ok('Energy: macros sum to target', near(en.protein * 4 + en.fat * 9 + en.carbs * 4, en.target, 0.5));
    ok('Energy: TDEE = BMR × PAL', near(en.tdee, en.bmr * 1.6, 0.01));

    // ---- weight trend
    const series = [];
    for (let i = 0; i < 21; i++) { const d = new Date(Date.UTC(2026, 10, 1 + i)); series.push({ date: d.toISOString().slice(0, 10), kg: 80 - (0.4 / 7) * i }); }
    const tr = C.weightTrend(series);
    ok('Trend recovers a −0.4 kg/week slope', near(tr.kgPerWeek, -0.4, 0.001), tr.kgPerWeek);
    ok('Trend needs ≥8 weigh-ins over ≥13 days', C.weightTrend(series.slice(0, 5)).enough === false);
    ok('Adjustment: inside band → keep', C.energyAdjustment(tr, [-0.75, -0.25]).action === 'keep');
    const fast = C.energyAdjustment(tr, [-0.25, -0.1]);
    ok('Adjustment: losing too fast → eat more (capped)', fast.action === 'increase' && fast.kcal > 0 && fast.kcal <= 250, JSON.stringify(fast));
    const slow = C.energyAdjustment(C.weightTrend(series.map(s => ({ ...s, kg: 80 }))), [-0.5, -0.25]);
    ok('Adjustment: not losing → eat less', slow.action === 'decrease' && slow.kcal < 0, JSON.stringify(slow));
    // Weekly averages from a scale app: three covering two weeks are a trend; as daily weigh-ins they are too few.
    const weeklyAvg = [0, 7, 14].map(i => ({ date: new Date(Date.UTC(2026, 10, 1 + i)).toISOString().slice(0, 10), kg: 80 - 0.05 * i }));
    ok('Weekly averages: three covering 2 weeks give a trend (as daily weigh-ins they do not)',
      C.weightTrend(weeklyAvg, 21, { weekly: true }).enough === true && C.weightTrend(weeklyAvg).enough === false);
    ok('Weekly averages: two are not enough', C.weightTrend(weeklyAvg.slice(0, 2), 21, { weekly: true }).enough === false);
    const waitWeekly = C.energyAdjustment(C.weightTrend(weeklyAvg.slice(0, 2), 21, { weekly: true }), [-0.5, -0.25]);
    ok('Weekly averages: the "not enough data" message asks for weekly averages', waitWeekly.action === 'wait' && /weekly averages/.test(waitWeekly.message), waitWeekly.message);

    // ---- other
    ok('HRmax Tanaka (31 y) ≈ 186', near(C.hrMax(31).tanaka, 186.3, 0.01));
    ok('Karvonen zone uses resting HR', near(C.hrZone(31, 60, 0.6, 0.7).lo, 60 + 126.3 * 0.6, 0.1));
    ok('Run spike limit = +10%', near(C.runSpikeLimit(30, 0.1), 33, 1e-9));
    ok('RIR→RPE mapping', rirToRpe('2') === '8' && rirToRpe('1-2') === '8–9');
    ok('Template placeholders keep numbers numeric', resolveValue('{{x}}', { x: 4 }) === 4 && resolveValue('{{x}} min', { x: 4 }) === '4 min');

    // ---- markdown
    const ctx = { cite: ids => `[${ids.join(',')}]`, link: (t, id, l) => `<a data-t="${t}">${l || id}</a>` };
    ok('Markdown escapes HTML', !renderMarkdown('<script>x<\/script><img src=x onerror=alert(1)>', ctx).includes('<script') &&
      !renderMarkdown('<img src=x onerror=alert(1)>', ctx).includes('<img'));
    ok('Markdown renders citations', renderMarkdown('Text [@a; @b].', ctx).includes('[a,b]'));
    ok('Markdown renders tables', renderMarkdown('| a | b |\n|---|---|\n| 1 | 2 |', ctx).includes('<table>'));
    const tl = renderMarkdown('| a | b |\n|---|---|\n| [[term:rir|RIR]] | 2 |', ctx);
    ok('A labelled link inside a table cell stays one cell', tl.includes('<a data-t="term">RIR</a>') && (tl.match(/<td/g) || []).length === 2, tl);
    ok('Markdown renders nested lists', /<ul><li>a<ul><li>b<\/li><\/ul><\/li><\/ul>/.test(renderMarkdown('- a\n  - b', ctx)));
    ok('Markdown warning callout', renderMarkdown('!> careful', ctx).includes('callout warn'));
    ok('Token scan finds refs and links', scanTokens('x [@r1] [[ex:a|A]]').refs[0] === 'r1' && scanTokens('[[ex:a|A]]').links[0].id === 'a');

    // ---- live content
    try {
      await loadContent();
      const probs = integrityReport();
      ok(`Content integrity: every citation and link resolves (${probs.length} problems)`, probs.length === 0, probs.slice(0, 10).join(' | '));
      let sessions = 0, bad = 0;
      for (const p of phases()) {
        for (let w = 1; w <= p.weeks; w++) {
          for (const d of scheduleFor(p, w)) {
            if (!d.sessionId) continue;
            const s = resolveSession(p.id, w, d.sessionId);
            sessions++;
            if (!s || !s.warmup.items.length || !s.main.items.length || !s.cooldown.items.length) bad++;
            for (const it of (s ? s.main.items : [])) if (it.reps && !(it.sets > 0)) bad++;
          }
        }
      }
      ok(`All ${sessions} scheduled sessions resolve with warm-up, main and cool-down, and sets defined`, bad === 0, `${bad} problems`);
      const { nextPosition } = await import('../js/engine.js');
      const np = (phase, week) => JSON.stringify(nextPosition({ phase, week }));
      ok('Sequencing: end of Phase 3 → Phase 4 week 1', np('p3', 24) === JSON.stringify({ phase: 'p4', week: 1 }), np('p3', 24));
      ok('Sequencing: end of a Phase 4 cycle wraps to Phase 4 week 1 (never into Maintenance mode)', np('p4', 12) === JSON.stringify({ phase: 'p4', week: 1 }), np('p4', 12));
      ok('Sequencing: Maintenance mode repeats itself', np('pm', 1) === JSON.stringify({ phase: 'pm', week: 1 }), np('pm', 1));
      ok('Sequencing: within a phase → next week', np('p1', 5) === JSON.stringify({ phase: 'p1', week: 6 }), np('p1', 5));
      // Optional phases: return point, fresh ticks and cycling. Runs against this browser's real storage,
      // so the touched keys are snapshotted first and restored afterwards.
      const { setPosition, getReturnTo, setDone, isDone, getPhase } = await import('../js/engine.js');
      const { store } = await import('../js/store.js');
      const KEYS = ['position', 'returnTo', 'done', 'doneArchive', 'history'];
      const snap = Object.fromEntries(KEYS.map(k => [k, store.get(k, undefined)]));
      if (!storageTests) skip('Away mode: return point, fresh ticks and cycling (7 checks that write storage)');
      else try {
        const away = phases().find(p => p.optional && p.noEquipment);
        ok('Away mode exists and is optional and cyclic', !!away && !!away.cyclic);
        store.remove('returnTo'); store.set('done', {});
        setPosition('p1', 5);
        setDone(away.id, 2, 0, true);
        setPosition(away.id, 1);
        const r = getReturnTo();
        ok('Entering Away mode remembers the main-sequence week', !!r && r.phase === 'p1' && r.week === 5, JSON.stringify(r));
        ok('A new visit to Away mode starts with fresh ticks', !isDone(away.id, 2, 0));
        ok('Earlier ticks are archived, not lost', store.get('doneArchive', []).some(a => a.key === `${away.id}:2:0`));
        const wrap = nextPosition({ phase: away.id, week: away.weeks });
        ok('Away mode repeats from its cycleTo week, skipping the introductory week', wrap.phase === away.id && wrap.week === (away.cycleTo || 1), JSON.stringify(wrap));
        setPosition('pm', 1);
        ok('Switching between optional phases keeps the return point', (getReturnTo() || {}).week === 5);
        setPosition('p1', 5);
        ok('Returning to the main sequence clears the return point', getReturnTo() === null);
        ok('The main sequence never advances into an optional phase',
          !phases().filter(p => !p.optional).some(p => { const n = nextPosition({ phase: p.id, week: p.weeks }); return n && getPhase(n.phase).optional; }));
      } finally {
        for (const k of KEYS) { if (snap[k] === undefined) store.remove(k); else store.set(k, snap[k]); }
      }
      // Design: every phase's colour key has an oxide colour in the stylesheet, and every phase but the
      // default (p0) has the rule that tints the app while you are in it.
      const css = await (await fetch('../css/app.css')).text();
      const noColour = phases().filter(p => !p.color || !css.includes(`--${p.color}:`) ||
        (p.color !== 'p0' && !css.includes(`[data-temper="${p.color}"]`))).map(p => p.id);
      ok('Every phase has a temper colour and app tint in the stylesheet', noColour.length === 0, noColour.join(', '));
      // Demonstration videos: the data file reads, every entry names a library item and a usable video, and an
      // exercise page shows only the app's own poster (nothing from YouTube) until play is pressed.
      const { youtubeId } = await import('../js/util.js');
      const { viewItem } = await import('../js/views.js');
      ok('videos.json loads', !DB.videosError, DB.videosError || '');
      const vids = Object.entries(DB.videos);
      const badVid = vids.filter(([k, v]) => !DB.idx.items.has(k) || !v || !youtubeId(v.id) || !v.title || !v.channel ||
        (v.length != null && !/^\d{1,2}(:\d{2}){1,2}$/.test(v.length)) ||
        (v.start != null && !(Number.isInteger(v.start) && v.start >= 0)) ||
        (v.embed != null && typeof v.embed !== 'boolean')).map(([k]) => k);
      ok(`Every video entry (${vids.length}) names a library item, a valid video id, a title and a channel`, vids.length > 0 && badVid.length === 0, badVid.join(', '));
      ok('youtubeId reads bare ids and common YouTube links, and rejects anything else',
        youtubeId('abcDEF_-123') === 'abcDEF_-123' && youtubeId('https://www.youtube.com/watch?v=abcDEF_-123&t=5s') === 'abcDEF_-123' &&
        youtubeId('https://youtu.be/abcDEF_-123?si=x') === 'abcDEF_-123' && youtubeId('https://www.youtube.com/shorts/abcDEF_-123') === 'abcDEF_-123' &&
        youtubeId('abc') === null && youtubeId('https://example.com/watch?v=abcDEF_-1234') === null);
      const withVid = vids.find(([, v]) => v.embed !== false);
      const vPage = withVid ? viewItem(withVid[0]).html : '';
      ok('An exercise page shows the video poster and loads nothing from YouTube before play',
        vPage.includes('class="demo"') && vPage.includes('data-video-play') && !/<iframe|youtube-nocookie|ytimg/.test(vPage), withVid && withVid[0]);
      const noVid = [...DB.exercises, ...DB.drills].find(x => !DB.videos[x.id]);
      ok('A library item without a video shows no video block', !noVid || !viewItem(noVid.id).html.includes('class="demo'), noVid && noVid.id);
      // Reading pages: tables of three or more columns carry their column names (cards on phones), a bold-only
      // paragraph is a small heading, verdict titles keep their words, and long pages get a plate, numbered
      // sections and contents that point at them.
      ok('A table of three or more columns labels its cells; a two-column table stays plain',
        /class="table-wrap cards"[\s\S]*data-label="b"/.test(renderMarkdown('| a | b | c |\n|---|---|---|\n| 1 | 2 | 3 |', ctx)) &&
        !renderMarkdown('| a | b |\n|---|---|\n| 1 | 2 |', ctx).includes('cards'));
      ok('A paragraph of only bold text is a small heading; bold inside a sentence is not',
        renderMarkdown('**Why these numbers**', ctx).includes('<p class="md-sub">') && !renderMarkdown('**Fat.** Low-fat diets', ctx).includes('md-sub'));
      const { splitVerdict, titleHtml } = await import('../js/reading.js');
      const tagless = h => h.replace(/<[^>]+>/g, '');
      ok('Verdict titles become badges without changing their words',
        splitVerdict('Creatine monohydrate: keep').tone === 'ok' && splitVerdict('Ashwagandha: avoid').tone === 'danger' &&
        splitVerdict('Heat: training at 13:00 in a hot climate') === null && tagless(titleHtml('Vitamin D3: keep at 1,000 IU')) === 'Vitamin D3: keep at 1,000 IU');
      const { viewPlan, viewArticle } = await import('../js/views.js');
      const badPlan = DB.pages.filter(p => {
        const h = viewPlan(p.id).html, n = (p.sections || []).length;
        return !h.includes('class="hero steel') || (h.match(/class="lr-sec/g) || []).length !== n || (n > 1 && (h.match(/data-scroll=/g) || []).length !== n);
      }).map(p => p.id);
      ok(`Every plan page (${DB.pages.length}) has its plate, every section numbered, and contents for each`, badPlan.length === 0, badPlan.join(', '));
      const LAYER_KEYS = ['summary', 'mechanisms', 'evidence', 'practice', 'uncertainties'];
      const badArticle = DB.articles.filter(a => { const h = viewArticle(a.id).html; return LAYER_KEYS.some(k => a[k] && !h.includes(`id="sec-${k}"`)); }).map(a => a.id);
      ok(`Every article (${DB.articles.length}) can be opened at any of its layers (…?s=evidence)`, badArticle.length === 0, badArticle.join(', '));
      // Guided player: every main item of every scheduled session is a step (the tests on test days too), and saved
      // progress is picked up again only for the same session within RESUME_HOURS.
      const { buildSteps, canResume, RESUME_HOURS } = await import('../js/player.js');
      const missing = new Set();
      for (const p of phases()) for (let w = 1; w <= p.weeks; w++) for (const d of scheduleFor(p, w)) {
        if (!d.sessionId) continue;
        const s = resolveSession(p.id, w, d.sessionId);
        const inSteps = new Set(buildSteps(s).map(st => st.it));
        for (const it of s.main.items) if (!inSteps.has(it)) missing.add(`${d.sessionId}:${it.ref}`);
      }
      ok('Every main item of every scheduled session is a step in the guided player', missing.size === 0, [...missing].slice(0, 10).join(', '));
      const baseline = buildSteps(resolveSession('p0', 1, 'p0-baseline')).filter(st => st.section === 'Main training');
      ok('The baseline test day has its 7 tests as steps, each with its instructions', baseline.length === 7 && baseline.every(st => st.target.length === 1),
        baseline.map(st => st.title).join(', '));
      const t0 = Date.parse('2026-11-01T18:00:00Z');
      ok(`Player progress resumes the same session within ${RESUME_HOURS} hours, and not after`,
        canResume({ sessionId: 'x', idx: 3, at: t0 - 3600000 }, 'x', t0) && !canResume({ sessionId: 'x', idx: 3, at: t0 - (RESUME_HOURS + 1) * 3600000 }, 'x', t0) &&
        !canResume({ sessionId: 'y', idx: 3, at: t0 }, 'x', t0) && !canResume({ sessionId: 'x', idx: 0, at: t0 }, 'x', t0) && !canResume(null, 'x', t0));
      // A week's own instructions (fewer sets, more reps in reserve…) are on every session page of that week.
      const { viewSession } = await import('../js/views.js');
      const noNotes = [];
      for (const p of phases()) for (let w = 1; w <= p.weeks; w++) {
        const notes = weekPlan(p, w).notes;
        if (!notes) continue;
        for (const d of scheduleFor(p, w)) if (d.sessionId && !viewSession(p.id, w, d.i).html.includes('<h3 style="margin-top:0">This week</h3>')) noNotes.push(`${p.id}:${w}:${d.i}`);
      }
      ok('Every session page in a week with its own instructions shows them', noNotes.length === 0, noNotes.slice(0, 10).join(', '));
      // The check-in's target band and the energy tool's goal follow the phase you are in; a band you pick yourself
      // is kept while you stay in that phase. Uses this browser's storage, so the touched keys are restored after.
      const { viewTool } = await import('../js/tools.js');
      const KEYS2 = ['position', 'tool:checkin', 'tool:energy'];
      const snap2 = Object.fromEntries(KEYS2.map(k => [k, store.get(k, undefined)]));
      if (!storageTests) skip('The check-in band and the energy goal follow the phase (2 checks that write storage)');
      else try {
        const selected = (html, name) => (new RegExp(`<select id="${name}"[\\s\\S]*?<option value="([^"]+)" selected`).exec(html) || [])[1];
        const none = new URLSearchParams();
        store.set('position', { phase: 'p2', week: 3 });
        store.set('tool:checkin', { goal: 'calibrate', goalFor: 'p0' });
        store.set('tool:energy', { goal: 'calibrate' });
        const want = getPhase('p2').energyGoal;
        const got = [selected(viewTool('checkin', none).html, 'goal'), selected(viewTool('energy', none).html, 'goal')];
        ok('After a phase change the check-in band and the energy goal follow the new phase', got.every(g => g === want), `${got.join(' / ')}, expected ${want}`);
        store.set('tool:checkin', { goal: 'cut', goalFor: 'p2' });
        ok('A target band picked in the current phase is kept', selected(viewTool('checkin', none).html, 'goal') === 'cut');
      } finally {
        for (const k of KEYS2) { if (snap2[k] === undefined) store.remove(k); else store.set(k, snap2[k]); }
      }

      // ---- 1.5.0 checks, in their own try so a failure here cannot hide the checks above.
      try {
      // The player's timers survive interruptions. A fake clock drives the countdown; saved states are moved on to
      // "now" by resumePoint, which the player uses both when it opens and when a late end is noticed.
      const P5 = await import('../js/player.js');
      let clock = 1000000;
      const ends = [];
      const cd = new P5.Countdown({ now: () => clock, onEnd: e => ends.push(e) });
      cd.set(90); cd.start(); clock += 30000;
      const runningSnap = cd.snapshot();
      cd.pause();
      const pausedSnap = cd.snapshot();
      cd.restore({ total: 90, endAt: clock + 20000 });
      const restoredLeft = cd.remaining();
      cd.stop();
      cd.restore({ total: 30, endAt: clock - 5000 });          // ended 5 s ago: the first tick ends it and says how late
      ok('Countdown: runs on a fake clock, saves and restores running and paused timers, reports a late end',
        runningSnap.total === 90 && runningSnap.endAt === 1090000 && pausedSnap.remainingMs === 60000 &&
        restoredLeft === 20 && ends.length === 1 && ends[0].endAt === clock - 5000 && ends[0].lateMs === 5000 && !cd.running,
        JSON.stringify({ runningSnap, pausedSnap, restoredLeft, ends }));
      const cd2 = new P5.Countdown({ now: () => clock });
      cd2.restore({ total: 60, endAt: clock + 10000 });
      cd2.add(15); const afterAdd = cd2.remaining();
      cd2.add(-30); const afterSub = cd2.remaining();
      cd2.stop();
      ok('Countdown: ±15 s on a restored timer moves its end, never to before now', afterAdd === 25 && afterSub === 0, `${afterAdd} / ${afterSub}`);

      const messy = C.phaseSpans([{ at: 'not a date', phase: 'pa' }, null, { at: '2026-11-05T09:00:00Z', phase: 'p1' }], isAway);
      ok('A switch to Away mode undone the same day is not a trip; unreadable history is skipped',
        C.awaySettle(sameDay, '2026-11-06') === null && messy.length === 0 && C.phaseSpans({ not: 'a list' }, isAway).length === 0, JSON.stringify({ sameDay, messy }));
      const t2673 = C.dailyTargets({ maintenanceKcal: 2673, goal: goalBy('recomp'), offset: 2370 - 2673, basisKg: 77 }, EP);
      const w6 = C.calibrationWindow([{ date: '2026-11-08', kg: 80 }, { date: '2026-11-14', kg: 79.8 }], { weekly: true });
      const w12 = C.calibrationWindow(cal14.slice(2));
      ok('A target at the shown end of its range counts as inside it; weekly averages 6 days apart are enough; intake starts at the first weigh-in',
        t2673.kcal === 2370 && t2673.kcalLow === 2370 && t2673.inRange === true && w6.enough && w12.firstDate === '2026-11-04' && w12.from === '2026-11-02',
        JSON.stringify({ t2673: [t2673.kcal, t2673.kcalLow, t2673.inRange], w6: w6.enough, w12: [w12.firstDate, w12.from] }));
      // The kcal ranges added to rules.json are the nutrition page's targets table, word for word.
      const tableText = JSON.stringify((DB.idx.pages.get('nutrition').sections || []).find(s => s.id === 'targets'));
      const rowRange = name => { const m = new RegExp(`\\| ${name} \\| ([+-]?\\d+) to ([+-]?\\d+) kcal/day`).exec(tableText); return m ? [+m[1], +m[2]].sort((a, b) => a - b).join() : null; };
      ok('The goals\' kcal ranges match the nutrition page\'s targets table',
        rowRange('Recomposition') === goalBy('recomp').kcalRange.join() && rowRange('Lean gain') === goalBy('lean-gain').kcalRange.join() &&
        rowRange('Dedicated fat loss') === goalBy('cut').kcalRange.join() && goalBy('maintain').kcalRange.join() === '0,0' && !goalBy('calibrate').kcalRange,
        [rowRange('Recomposition'), rowRange('Lean gain'), rowRange('Dedicated fat loss')].join(' / '));
      ok('Phase 1 weeks 1-2 are calibration weeks; week 3 starts recomposition', energyGoalAt(getPhase('p1'), 1) === 'calibrate' &&
        energyGoalAt(getPhase('p1'), 2) === 'calibrate' && energyGoalAt(getPhase('p1'), 3) === 'recomp' && energyGoalAt(getPhase('p0'), 1) === 'calibrate');

      // The tools in use (storage): goals follow the week and survive a trip; the energy tool keeps targets; the
      // check-in pauses in Away mode and calibrates in the calibration weeks.
      const KEYS4 = ['position', 'history', 'returnTo', 'weights', 'tool:checkin', 'tool:energy', 'energy:maintenance', 'energy:targets'];
      const snap4 = Object.fromEntries(KEYS4.map(k => [k, store.get(k, undefined)]));
      if (!storageTests) skip('Calibration and targets in the tools: 4 checks that write storage');
      else try {
        const sel = (html, name) => (new RegExp(`<select id="${name}"[\\s\\S]*?<option value="([^"]+)" selected`).exec(html) || [])[1];
        const none = new URLSearchParams();
        store.set('history', []);
        store.remove('returnTo');
        store.set('position', { phase: 'p1', week: 1 });
        store.set('tool:checkin', {});
        const inCal = sel(viewTool('checkin', none).html, 'goal');
        store.set('position', { phase: 'p1', week: 3 });
        store.set('tool:checkin', { goal: 'cut', goalFor: 'p1', goalDefault: 'recomp' });
        const kept = sel(viewTool('checkin', none).html, 'goal');
        store.set('returnTo', { phase: 'p1', week: 3, left: new Date().toISOString() });
        store.set('position', { phase: 'pa', week: 2 });
        const awayHtml = viewTool('checkin', none).html;
        store.set('tool:checkin', { goal: 'maintain', goalFor: 'pa', goalDefault: 'maintain', mainGoal: 'cut', mainFor: 'p1', mainDefault: 'recomp' });
        store.remove('returnTo');
        store.set('position', { phase: 'p1', week: 3 });
        const back = sel(viewTool('checkin', none).html, 'goal');
        ok('Goals follow the week (Phase 1 week 1: Calibrate), a pick of your own is kept, and comes back after Away mode',
          inCal === 'calibrate' && kept === 'cut' && sel(awayHtml, 'goal') === 'maintain' && awayHtml.includes('name="mainGoal" value="cut"') && back === 'cut',
          JSON.stringify({ inCal, kept, away: sel(awayHtml, 'goal'), back }));

        // The energy tool with 14 days of weigh-ins and a saved maintenance.
        store.set('weights', cal14.map(e => ({ date: e.date, kg: Math.round(e.kg * 100) / 100 })));
        store.set('energy:maintenance', { v: 1, entries: [{ kcal: 2670, intake: 2450, from: '2026-11-02', to: '2026-11-15', days: 14, endKg: 79.7, savedAt: '2026-11-15T13:00:00.000Z' }] });
        store.set('energy:targets', { v: 1, offsets: {}, basisKg: 77, basisAt: '2026-11-15' });
        store.set('tool:energy', { goal: 'recomp', goalFor: 'p1', goalDefault: 'recomp' });
        const ev = viewTool('energy', none);
        const eb = document.createElement('div');
        eb.innerHTML = ev.html;
        ev.after(eb);
        const ein = eb.querySelector('#calIntake');
        ein.value = '2450';
        ein.dispatchEvent(new Event('input', { bubbles: true }));
        const energyOk = (eb.querySelector('#calOut .result .big') || {}).textContent === '2,450 + 220 = 2,670' &&
          /2,520 kcal/.test(eb.querySelector('#tgtOut').textContent) && /140–155 g/.test(eb.querySelector('#tgtOut').textContent) &&
          (eb.querySelector('#tgtKcal') || {}).value === '2520' &&
          eb.querySelector('[data-cal-save]').disabled === true && eb.querySelector('[data-cal-save]').textContent === 'Saved';   // the same window is already saved
        if (ev.cleanup) ev.cleanup();

        // The check-in in Away mode, in calibration weeks and in the week after a trip.
        const checkinText = () => { const v = viewTool('checkin', none); const b = document.createElement('div'); b.innerHTML = v.html; v.after(b); const t = b.querySelector('#out').textContent; if (v.cleanup) v.cleanup(); return t; };
        store.set('tool:checkin', {});
        store.set('position', { phase: 'pa', week: 2 });
        const tAway = checkinText();
        store.set('position', { phase: 'p1', week: 1 });
        const tCal = checkinText();
        const ago = d => new Date(Date.now() - d * 86400000).toISOString();
        store.set('history', [{ at: ago(10), phase: 'pa', week: 1 }, { at: ago(3), phase: 'p1', week: 5 }]);
        store.set('position', { phase: 'p1', week: 5 });
        const tSettle = checkinText();
        ok('The energy tool works out the maintenance and keeps the targets; the check-in pauses in Away mode, calibrates in Phase 1 week 1, and waits a week after a trip',
          energyOk && /Paused while you are away/.test(tAway) && /Calibrating your maintenance/.test(tCal) && !/Adjust intake/.test(tCal) && /Back from Away mode/.test(tSettle),
          JSON.stringify({ energyOk, away: tAway.slice(0, 60), cal: tCal.slice(0, 60), settle: tSettle.slice(0, 60) }));

        // After a calibration that measured a gain, the verdict does not ask for a second cut from the same weigh-ins.
        store.set('history', []);
        store.set('weights', cal14.map((e, i) => ({ date: e.date, kg: Math.round((80 + (0.2 / 7) * i) * 100) / 100 })));
        store.set('position', { phase: 'p1', week: 3 });
        store.set('tool:checkin', {});
        const tAfter = checkinText();
        // A target you type for the Maintenance goal is yours, not "your saved maintenance".
        store.set('tool:energy', { goal: 'maintain', goalFor: 'p1', goalDefault: 'recomp' });
        store.set('energy:targets', { v: 1, offsets: { maintain: 150 }, basisKg: 77, basisAt: '2026-11-15' });
        const ev2 = viewTool('energy', none);
        const eb2 = document.createElement('div');
        eb2.innerHTML = ev2.html;
        ev2.after(eb2);
        const own = eb2.querySelector('#tgtOut').textContent;
        if (ev2.cleanup) ev2.cleanup();
        ok('After a calibration the check-in judges only the weigh-ins since; a typed Maintenance target is shown as your own',
          /Not enough data yet/.test(tAfter) && /Judged from your weigh-ins after your calibration/.test(tAfter) && !/Adjust intake/.test(tAfter) &&
          /2,820 kcal/.test(own) && /your own target/.test(own), JSON.stringify({ after: tAfter.slice(0, 160), own: own.slice(0, 160) }));
      } finally {
        for (const k of KEYS4) { if (snap4[k] === undefined) store.remove(k); else store.set(k, snap4[k]); }
      }
      } catch (err) {
        ok('1.5.0 checks run to the end', false, err.message);
      }
      const longest = [];
      for (const p of phases()) for (const [sid] of DB.idx.sessions) {
        const s = resolveSession(p.id, 1, sid);
        if (s) longest.push([sid, s.minutes, estimateMinutes(s)]);
      }
      const over = longest.filter(([, planned, est]) => planned && est > planned + 10);
      ok('No session estimate exceeds its planned minutes by >10', over.length === 0, JSON.stringify(over.slice(0, 8)));
    } catch (err) {
      ok('Content loads', false, err.message);
    }

    document.getElementById('summary').innerHTML = `<p class="${fail ? 'fail' : 'pass'}">${pass} passed, ${fail} failed${skipped ? `, ${skipped} skipped` : ''}</p>`;
  </script>
</body>
</html>
